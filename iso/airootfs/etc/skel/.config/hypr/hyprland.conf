# ============================================================
#  DreamyOS – Hyprland configuration
#  Press SUPER + / to see all keyboard shortcuts.
#  Docs: https://wiki.hypr.land/Configuring/
# ============================================================

# --- Screen ---
# "preferred" uses your screen's best resolution.
monitor = , preferred, auto, 1

# --- Default apps ---
$terminal    = kitty
$browser     = firefox
$fileManager = nautilus
$menu        = fuzzel

# --- Programs that start with the desktop ---
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = swaybg -i /usr/share/backgrounds/dreamyos/dreamy-light.png -m fill
exec-once = waybar
exec-once = mako
exec-once = systemctl --user start hyprpolkitagent
exec-once = sleep 2 && notify-send -t 15000 "Welcome to DreamyOS" "SUPER + Enter: terminal   ·   SUPER + Space: apps   ·   SUPER + /: all shortcuts"

# --- Environment ---
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb

# --- Look and feel: white to light blue ---
general {
    gaps_in = 6
    gaps_out = 14
    border_size = 2
    col.active_border = rgba(7cc4ffee) rgba(c4e6ffee) 45deg
    col.inactive_border = rgba(dbe9f6aa)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 14
    active_opacity = 1.0
    inactive_opacity = 0.97

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(4a86c033)
    }

    blur {
        enabled = true
        size = 6
        passes = 2
    }
}

animations {
    enabled = true
    bezier = dreamy, 0.22, 1, 0.36, 1
    animation = windows, 1, 5, dreamy, popin 85%
    animation = border, 1, 10, default
    animation = fade, 1, 6, dreamy
    animation = workspaces, 1, 5, dreamy, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

# --- Keyboard and mouse ---
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
    }
}

# --- Keyboard shortcuts ---
$mod = SUPER

bind = $mod, Return, exec, $terminal
bind = CTRL ALT, T, exec, $terminal
bind = $mod, Space, exec, $menu
bind = $mod, B, exec, $browser
bind = $mod, E, exec, $fileManager
bind = $mod, slash, exec, dreamy-keybinds
bind = $mod, Escape, exec, dreamy-power

bind = $mod, Q, killactive,
bind = $mod, F, fullscreen,
bind = $mod, T, togglefloating,
bind = $mod, P, pseudo,
bind = $mod SHIFT, M, exit,

# Move focus / move windows
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# Move / resize windows with SUPER + mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Screenshot an area to the clipboard
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy

# Volume and brightness keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# --- Virtual machine tweaks (written by dreamy-session; keep this line last) ---
source = ~/.config/hypr/vm.conf
