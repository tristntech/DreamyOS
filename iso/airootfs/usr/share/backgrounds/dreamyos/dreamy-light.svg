<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- DreamyOS light wallpaper: white to light blue sky with soft glows and clouds -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#e6f3ff"/>
      <stop offset="1" stop-color="#a6d4ff"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="cloud" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- soft glows -->
  <circle cx="1480" cy="230" r="260" fill="#ffffff" opacity="0.75" filter="url(#glow)"/>
  <circle cx="330" cy="830" r="330" fill="#bde0ff" opacity="0.6" filter="url(#glow)"/>
  <circle cx="1120" cy="690" r="220" fill="#d4ebff" opacity="0.8" filter="url(#glow)"/>

  <!-- clouds -->
  <g fill="#ffffff" filter="url(#cloud)">
    <g opacity="0.9">
      <ellipse cx="260" cy="1000" rx="320" ry="90"/>
      <ellipse cx="420" cy="950" rx="190" ry="110"/>
      <ellipse cx="150" cy="960" rx="150" ry="80"/>
    </g>
    <g opacity="0.85">
      <ellipse cx="1560" cy="1010" rx="420" ry="100"/>
      <ellipse cx="1420" cy="955" rx="200" ry="115"/>
      <ellipse cx="1680" cy="940" rx="230" ry="125"/>
    </g>
    <g opacity="0.55">
      <ellipse cx="900" cy="1050" rx="380" ry="70"/>
      <ellipse cx="1240" cy="360" rx="160" ry="38"/>
      <ellipse cx="1330" cy="345" rx="110" ry="42"/>
      <ellipse cx="520" cy="250" rx="140" ry="32"/>
      <ellipse cx="600" cy="238" rx="90" ry="34"/>
    </g>
  </g>
</svg>
